<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GreptimeDB browser ingestion</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 36rem;
        margin: 3rem auto;
        padding: 0 1rem;
      }
      label {
        display: block;
        margin: 1rem 0;
      }
      input {
        display: block;
        box-sizing: border-box;
        width: 100%;
        padding: 0.5rem;
      }
      button {
        padding: 0.6rem 1rem;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <h1>GreptimeDB browser ingestion</h1>
    <p>Insert two rows into <code>browser_metrics_demo</code> over gRPC-Web.</p>
    <form>
      <label
        >gRPC endpoint <input name="endpoint" type="url" value="http://localhost:4001" required
      /></label>
      <label>Database <input name="database" value="public" required /></label>
      <label>Username (optional) <input name="username" autocomplete="username" /></label>
      <label
        >Password <input name="password" type="password" autocomplete="current-password"
      /></label>
      <button type="submit">Insert rows</button>
    </form>
    <pre role="status" aria-live="polite"></pre>
    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
